name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Validate plugin.json and Python syntax
        run: |
          python3 -c "import json; d=json.load(open('plugin.json')); assert d['name']=='antigravity-seo'"
          python3 -m compileall -q scripts/
          uv run scripts/schema_generate.py --help
