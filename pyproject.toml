[project]
name = "antigravity-seo"
version = "1.2.0"
description = "Autonomous SEO, GEO, Entity Disambiguation, Schema.org, CWV, and Agentic Readiness plugin for Google Antigravity"
requires-python = ">=3.11"
license = "MIT"
readme = "README.md"
authors = [
  {name = "Rishan KP"},
  {name = "Daniel Agrici (upstream claude-seo)"}
]
keywords = ["seo", "antigravity", "geo", "ai-tools", "schema-markup", "e-e-a-t", "entity-disambiguation"]

[project.urls]
Homepage = "https://github.com/devrishan/antigravity-seo"
Repository = "https://github.com/devrishan/antigravity-seo"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
